<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Plan Your Tasks</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <svg width="40" height="40" viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="7" fill="var(--accent)"/>
          <path d="M7 9h14M7 14h9M7 19h11" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 class="auth-title">Selamat Datang</h1>
      <p class="auth-subtitle">Plan Your Tasks. Own Your Time.</p>

      {% if error %}
        <div class="alert alert-error">{{ error }}</div>
      {% endif %}

      <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" name="email"
                 value="{{ email }}" placeholder="nama@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Kata Sandi</label>
          <div class="input-password-wrap">
            <input class="form-input" type="password" id="password" name="password"
                   placeholder="Masukkan kata sandi" required autocomplete="current-password">
            <button type="button" class="btn-toggle-pass" aria-label="Lihat kata sandi">
              <svg class="eye-show" width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M1 10S4 4 10 4s9 6 9 6-3 6-9 6S1 10 1 10z" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="2"/></svg>
              <svg class="eye-hide" width="18" height="18" viewBox="0 0 20 20" fill="none" style="display:none"><path d="M3 3l14 14M8.5 8.5A3 3 0 0013 13M4.5 5.5C2.5 7 1 10 1 10s3 6 9 6c1.8 0 3.4-.5 4.8-1.3M7 4.3C8 4.1 9 4 10 4c6 0 9 6 9 6s-.9 1.8-2.5 3.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Masuk</button>
      </form>

      <p class="auth-switch">Belum punya akun? <a href="{{ url_for('auth.register') }}">Daftar sekarang</a></p>
    </div>
    <button class="btn-theme-toggle auth-theme-toggle" id="themeToggle" aria-label="Ganti tema">
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="4" stroke="currentColor" stroke-width="2"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" fill="currentColor"/></svg>
    </button>
  </div>
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
